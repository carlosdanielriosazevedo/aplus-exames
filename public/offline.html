<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08132e">
<title>Sem ligação · APProva+</title>
<style>
  html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f6f7fb;color:#102b42}
  main{min-height:100%;display:grid;place-items:center;padding:24px;box-sizing:border-box}
  section{max-width:420px;width:100%;background:#fff;border:1px solid #e3e7ef;border-radius:20px;padding:28px 24px;text-align:center;box-shadow:0 18px 40px rgba(16,43,66,.08)}
  .logo{font-weight:900;font-size:22px;margin-bottom:18px}.logo b{color:#f59e0b}
  h1{font-size:22px;line-height:1.25;margin:0 0 10px}
  p{font-size:16px;line-height:1.5;color:#4d566b;margin:0 0 20px}
  button{width:100%;min-height:52px;border:0;border-radius:14px;background:#f59e0b;color:#102b42;font-weight:800;font-size:17px;cursor:pointer}
  small{display:block;margin-top:14px;font-size:13px;color:#4d566b}
</style>
</head>
<body>
<main><section>
  <div class="logo">APProva<b>+</b></div>
  <h1>Estás sem internet</h1>
  <p>A APProva+ precisa de ligação para abrir. O teu progresso continua guardado neste dispositivo.</p>
  <button type="button" onclick="location.reload()">Tentar novamente</button>
  <small>Assim que a ligação voltar, a app abre onde ficaste.</small>
</section></main>
</body>
</html>
