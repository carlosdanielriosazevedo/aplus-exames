name: Fix materialized grader duplicate once

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Skip bot-triggered follow-up
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            echo "Bot follow-up: nothing to do."
            exit 0
          fi
      - name: Remove duplicated function declaration with an exact source patch
        run: |
          cat > /tmp/grader.patch <<'PATCH'
          diff --git a/app/lib/constructedResponse.js b/app/lib/constructedResponse.js
          --- a/app/lib/constructedResponse.js
          +++ b/app/lib/constructedResponse.js
          @@ -499,16 +499,6 @@ function presentsOnlyFinalResult(question,answer){
             const finalSpec=question.response.steps.at(-1);
             return gradeStep(finalSpec,line).correct;
           }
          -function presentsOnlyFinalResult(question,answer){
          -  if(answer&&typeof answer==="object"&&Object.values(answer.steps||{}).some(hasText))return false;
          -  const lines=stepwiseLines(answer);
          -  if(lines.length!==1||question?.response?.type!=="stepwise"||question.response.steps.length<2)return false;
          -  const line=lines[0];
          -  const equalityCount=(line.match(/=/g)||[]).length;
          -  if(equalityCount>1||/[→⇒]/u.test(line))return false;
          -  const finalSpec=question.response.steps.at(-1);
          -  return gradeStep(finalSpec,line).correct;
          -}
           
           function constantValue(source){
             const canonical=canonicalPolynomial(normalizedExpression(source));
          PATCH
          git apply --check /tmp/grader.patch
          git apply /tmp/grader.patch
          git diff --check
      - name: Commit corrected source
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/constructedResponse.js
          git commit -m "Fix: remove duplicate materialized grader helper"
          git push origin HEAD:main
