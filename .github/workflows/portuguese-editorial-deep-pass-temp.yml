name: Portuguese Editorial Deep Pass Temp

on:
  push:
    branches:
      - codex/portuguese-editorial-deep-pass

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/portuguese-editorial-deep-pass
      - name: Strengthen latest Portuguese items
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='content/vnext/portuguese/foundation/portuguese-639-wave6.json';
          const data=JSON.parse(fs.readFileSync(path,'utf8'));
          const byId=id=>{
            const item=data.items.find(row=>row.id===id);
            if(!item) throw new Error(`Missing ${id}`);
            return item;
          };

          Object.assign(byId('PT639-FND-101'),{
            options:[
              'O centro abre às nove horas todos os dias.',
              'A última entrada acontece uma hora antes do encerramento.',
              'Ao fim de semana, a última entrada acontece às nove horas.',
              'Durante a semana, o centro encerra às dez horas.'
            ]
          });

          Object.assign(byId('PT639-FND-106'),{
            options:[
              'passar diretamente do problema para soluções, sem analisar os fatores que o explicam.',
              'organizar a informação apenas por ordem cronológica, sem relacionar causas e respostas.',
              'apresentar primeiro as medidas e só depois identificar o problema que pretendem resolver.',
              'passar do diagnóstico do problema para a comparação de fatores e para possíveis respostas.'
            ],
            explanation:'A sequência parte do crescimento do consumo, compara os setores que contribuem para ele e termina em medidas, ligando diagnóstico, análise e resposta.'
          });

          Object.assign(byId('PT639-FND-107'),{
            options:['a personificação.','a hipérbole.','a comparação.','a aliteração.']
          });

          Object.assign(byId('PT639-FND-110'),{
            options:[
              'uma preocupação sobretudo prática com a conservação da casa.',
              'uma tentativa de recuperar exatamente os hábitos familiares do passado.',
              'uma ligação afetiva persistente à memória do pai.',
              'um desconforto que leva a personagem a evitar qualquer contacto com recordações.'
            ]
          });

          Object.assign(byId('PT639-FND-113'),{
            options:[
              'Reunir todos os exemplos num parágrafo final, separados dos benefícios a que dizem respeito.',
              'Agrupar cada benefício com os exemplos que o explicam.',
              'Ordenar os exemplos apenas pelo comprimento, mantendo-os afastados das ideias que ilustram.',
              'Substituir os exemplos por repetições dos benefícios já apresentados.'
            ]
          });

          Object.assign(byId('PT639-FND-114'),{
            options:[
              'As zonas verdes podem tornar o recreio visualmente mais agradável.',
              'Várias escolas já têm árvores e canteiros junto aos recreios.',
              'Mais sombra e vegetação podem reduzir o calor e criar espaços de descanso mais confortáveis para os alunos.',
              'Os recreios são usados por muitos alunos durante os intervalos.'
            ],
            explanation:'A opção correta estabelece uma cadeia explícita entre a medida proposta, os seus efeitos e uma consequência relevante para os alunos; as restantes são observações relacionadas, mas fundamentam a tese de forma incompleta.'
          });

          Object.assign(byId('PT639-FND-119'),{
            acceptedAnswers:['concessão','valor concessivo','concessivo'],
            explanation:'A expressão introduz uma ideia que se verifica apesar da expectativa criada pela brevidade do relatório, assumindo valor concessivo.'
          });

          fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
      - name: Commit editorial pass
        run: |
          if git diff --quiet -- content/vnext/portuguese/foundation/portuguese-639-wave6.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/vnext/portuguese/foundation/portuguese-639-wave6.json
          git commit -m "Reforçar qualidade editorial da sexta vaga de Português"
          git push origin HEAD:codex/portuguese-editorial-deep-pass
