name: Temp Portuguese mini-exam audit integration

on:
  push:
    branches:
      - codex/portuguese-mini-exam-flow
    paths:
      - .github/workflows/temp-portuguese-mini-exam-audit.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/portuguese-mini-exam-flow
      - name: Integrate audit in package and Technical Gate
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replaceOnce(source,from,to,label){
            const count=source.split(from).length-1;
            if(count!==1)throw new Error(`${label}: esperado 1 match, obtidos ${count}`);
            return source.replace(from,to);
          }
          const packagePath='package.json';
          let pkg=fs.readFileSync(packagePath,'utf8');
          pkg=replaceOnce(pkg,
            '    "portuguese-passage-ui:audit": "node scripts/portuguese-passage-ui-audit.mjs",\n',
            '    "portuguese-passage-ui:audit": "node scripts/portuguese-passage-ui-audit.mjs",\n    "portuguese-mini-exam-flow:audit": "node scripts/portuguese-mini-exam-flow-audit.mjs",\n',
            'package script');
          fs.writeFileSync(packagePath,pkg);

          const gatePath='scripts/technical-gate.mjs';
          let gate=fs.readFileSync(gatePath,'utf8');
          gate=replaceOnce(gate,
            '  ["Interface de texto partilhado Português 639","npm",["run","portuguese-passage-ui:audit"]],\n',
            '  ["Interface de texto partilhado Português 639","npm",["run","portuguese-passage-ui:audit"]],\n  ["Fluxo integrado de Mini-exame Português 639","npm",["run","portuguese-mini-exam-flow:audit"]],\n',
            'technical gate');
          fs.writeFileSync(gatePath,gate);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json scripts/technical-gate.mjs
          git commit -m "Integrar fluxo de Mini-exame Português no Technical Gate"
          git push origin HEAD:codex/portuguese-mini-exam-flow
