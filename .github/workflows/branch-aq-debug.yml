name: Debug AQ self-corrected

on:
  push:
    branches: [codex/score-explainability-all-subjects]

jobs:
  debug:
    if: ${{ !contains(github.event.head_commit.message, '[aq-debug-output]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/score-explainability-all-subjects
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/debug-aq-self-corrected.mjs
