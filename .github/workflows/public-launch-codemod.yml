name: Public launch codemod

on:
  push:
    branches:
      - launch/public-rc-hardening
    paths:
      - .github/workflows/public-launch-codemod.yml
      - scripts/public-launch-codemod.mjs

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[public-launch-codemod]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/public-rc-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply launch copy and consistency fixes
        run: node scripts/public-launch-codemod.mjs
      - name: Commit codemod changes
        run: |
          if git diff --quiet; then
            echo "No codemod changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/AccountCloud.js app/components/PhysicsChemistrySubject.js
          git commit -m "[public-launch-codemod] Normalize public copy"
          git push origin HEAD:launch/public-rc-hardening
