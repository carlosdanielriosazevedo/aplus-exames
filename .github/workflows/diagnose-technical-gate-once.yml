name: Diagnose Technical Gate Once
on:
  push:
    branches:
      - codex/portuguese-wave5-balanced-main
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Portuguese boundary cases directly
        shell: bash
        run: |
          set +e
          node scripts/portuguese-boundary-cases-audit.mjs > boundary-cases.log 2>&1
          echo "$?" > boundary-cases-exit.txt
          cat boundary-cases.log
          exit 0
      - name: Regenerate Portuguese difficulty matrix
        run: node scripts/generate-portuguese-difficulty.mjs
      - name: Commit generated matrix if needed
        shell: bash
        run: |
          if git diff --quiet -- content/vnext/portuguese/foundation/portuguese-639-difficulty.json; then
            echo "Difficulty matrix already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/vnext/portuguese/foundation/portuguese-639-difficulty.json
            git commit -m "Regenerar dificuldade de Português para 100 itens"
            git push
          fi
      - run: npm install --no-audit --no-fund
      - name: Capture technical gate
        shell: bash
        run: |
          set +e
          npm run technical:gate > technical-gate.log 2>&1
          code=$?
          echo "$code" > technical-gate-exit.txt
          cat technical-gate.log
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-gate-diagnostic
          path: |
            boundary-cases.log
            boundary-cases-exit.txt
            technical-gate.log
            technical-gate-exit.txt
          if-no-files-found: ignore
