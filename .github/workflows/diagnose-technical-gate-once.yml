name: Diagnose Technical Gate Once
on:
  push:
    branches:
      - codex/portuguese-wave5-balanced-main
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Normalize duplicate Portuguese prompts once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('content/vnext/portuguese/foundation/portuguese-639-wave4.json'): (
                  '"id":"PT639-FND-061"',
                  '"prompt":"Qual das afirmações está de acordo com o texto?"',
                  '"prompt":"Que afirmação está de acordo com o texto apresentado?"'
              ),
              Path('content/vnext/portuguese/foundation/portuguese-639-wave5.json'): (
                  '"id":"PT639-FND-081"',
                  '"prompt":"Qual das afirmações está de acordo com o texto?"',
                  '"prompt":"Que afirmação reproduz corretamente a informação do texto?"'
              ),
          }
          for path, (item_marker, old, new) in replacements.items():
              text = path.read_text(encoding='utf-8')
              idx = text.find(item_marker)
              if idx < 0:
                  raise SystemExit(f'{path}: item marker missing')
              prompt_idx = text.find(old, idx)
              if prompt_idx < 0:
                  if new in text[idx:]:
                      continue
                  raise SystemExit(f'{path}: expected duplicate prompt missing after {item_marker}')
              text = text[:prompt_idx] + new + text[prompt_idx+len(old):]
              path.write_text(text, encoding='utf-8')
          PY
          if git diff --quiet -- content/vnext/portuguese/foundation/portuguese-639-wave4.json content/vnext/portuguese/foundation/portuguese-639-wave5.json; then
            echo "Duplicate prompts already normalized"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/vnext/portuguese/foundation/portuguese-639-wave4.json content/vnext/portuguese/foundation/portuguese-639-wave5.json
            git commit -m "Distinguir enunciados repetidos de Português"
            git push
          fi
      - name: Report duplicate Portuguese prompts
        shell: bash
        run: |
          node --input-type=module <<'NODE' > portuguese-duplicate-prompts.log
          import {readdirSync,readFileSync} from 'node:fs';
          const dir='content/vnext/portuguese/foundation';
          const files=readdirSync(dir).filter(name=>/^portuguese-639-(?:pilot|wave\d+)\.json$/.test(name));
          const items=files.flatMap(name=>JSON.parse(readFileSync(`${dir}/${name}`,'utf8')).items);
          const byPrompt=new Map();
          for(const item of items){
            const rows=byPrompt.get(item.prompt)||[];
            rows.push(item.id);
            byPrompt.set(item.prompt,rows);
          }
          for(const [prompt,ids] of byPrompt){
            if(ids.length>1)console.log(`${ids.join(', ')} :: ${prompt}`);
          }
          NODE
          cat portuguese-duplicate-prompts.log
      - name: Check Portuguese boundary cases directly
        shell: bash
        run: |
          set +e
          node scripts/portuguese-boundary-cases-audit.mjs > boundary-cases.log 2>&1
          echo "$?" > boundary-cases-exit.txt
          cat boundary-cases.log
          exit 0
      - name: Upload early Portuguese diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: portuguese-early-diagnostic
          path: |
            portuguese-duplicate-prompts.log
            boundary-cases.log
            boundary-cases-exit.txt
      - name: Regenerate Portuguese difficulty matrix
        run: node scripts/generate-portuguese-difficulty.mjs
      - name: Commit generated matrix if needed
        shell: bash
        run: |
          if git diff --quiet -- content/vnext/portuguese/foundation/portuguese-639-difficulty.json; then
            echo "Difficulty matrix already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/vnext/portuguese/foundation/portuguese-639-difficulty.json
            git commit -m "Regenerar dificuldade de Português para 100 itens"
            git push
          fi
      - run: npm install --no-audit --no-fund
      - name: Capture technical gate
        shell: bash
        run: |
          set +e
          npm run technical:gate > technical-gate.log 2>&1
          code=$?
          echo "$code" > technical-gate-exit.txt
          cat technical-gate.log
          exit 0
      - name: Upload gate diagnostic
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: technical-gate-diagnostic
          path: |
            technical-gate.log
            technical-gate-exit.txt
          if-no-files-found: ignore
