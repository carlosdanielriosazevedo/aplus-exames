name: Regenerate Portuguese Wave6 Artifacts

on:
  push:
    branches:
      - codex/portuguese-wave6-balanced

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/portuguese-wave6-balanced
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run portuguese-difficulty:generate
      - run: npm run portuguese-coverage
      - name: Commit generated artifacts
        run: |
          if git diff --quiet -- content/vnext/portuguese/foundation/portuguese-639-difficulty.json docs/PORTUGUESE_639_COVERAGE.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/vnext/portuguese/foundation/portuguese-639-difficulty.json docs/PORTUGUESE_639_COVERAGE.md
          git commit -m "Regenerar dificuldade e cobertura de Português para 120 itens"
          git push origin HEAD:codex/portuguese-wave6-balanced
