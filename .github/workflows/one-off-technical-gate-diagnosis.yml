name: One-off technical gate diagnosis

on:
  push:
    branches:
      - fix/enforce-total-client-bundle-budget

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enforce-total-client-bundle-budget
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Capture technical gate output
        shell: bash
        run: |
          set +e
          npm run technical:gate > technical-gate-diagnosis.txt 2>&1
          code=$?
          echo "EXIT_CODE=$code" >> technical-gate-diagnosis.txt
          exit 0
      - name: Commit diagnosis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add technical-gate-diagnosis.txt
          git commit -m "chore: record technical gate diagnosis"
          git push origin HEAD:fix/enforce-total-client-bundle-budget
