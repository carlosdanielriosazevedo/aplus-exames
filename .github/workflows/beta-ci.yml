name: Beta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Technical gate
        run: npm run technical:gate

      - name: Content readiness report
        run: npm run content:readiness

      - name: Next.js production build
        run: npm run build
        env:
          DATABASE_URL: ""
          NEXT_PUBLIC_NEON_AUTH_URL: ""
          NEXT_PUBLIC_NEON_DATA_API_URL: ""
