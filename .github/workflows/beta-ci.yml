name: Beta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regenerate-math-banks:
    if: github.event_name == 'pull_request' && github.head_ref == 'fix/block1-1-committed-math-copy' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate banks and verify their deterministic output
        run: |
          node scripts/generate-vnext-diagnostic.mjs
          node scripts/generate-vnext-mission.mjs
          node scripts/generate-vnext-exam.mjs
          node scripts/generate-vnext-diagnostic.mjs --check
          node scripts/generate-vnext-mission.mjs --check
          node scripts/generate-vnext-exam.mjs --check
          git add app/data/vnextDiagnostic.js app/data/vnextMission.js app/data/vnextExam.js
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(math): synchronize the generated question banks"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Install mobile browser test runtime
        run: |
          rm -rf /tmp/approva-playwright
          mkdir -p /tmp/approva-playwright
          npm install --prefix /tmp/approva-playwright --no-save --no-package-lock --legacy-peer-deps --no-audit --no-fund @playwright/test@1.55.0
          ln -s /tmp/approva-playwright/node_modules/@playwright node_modules/@playwright
          ln -s /tmp/approva-playwright/node_modules/playwright node_modules/playwright
          ln -s /tmp/approva-playwright/node_modules/playwright-core node_modules/playwright-core
          /tmp/approva-playwright/node_modules/.bin/playwright install --with-deps chromium

      - name: Mobile browser regression · 390x844
        run: |
          set -o pipefail
          echo "::group::Playwright discovered tests"
          /tmp/approva-playwright/node_modules/.bin/playwright test --config=playwright.config.mjs --list
          echo "::endgroup::"
          echo "PLAYWRIGHT_START $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          timeout --signal=TERM --kill-after=20s 12m /tmp/approva-playwright/node_modules/.bin/playwright test --config=playwright.config.mjs
          result=$?
          echo "PLAYWRIGHT_END $(date -u +%Y-%m-%dT%H:%M:%SZ) exit=$result"
          exit "$result"

      - name: Unit tests
        run: npm run test:unit

      - name: Technical gate
        run: npm run technical:gate

      - name: Public launch hardening
        run: node scripts/public-launch-hardening-audit.mjs

      - name: Portuguese automatic grading contract
        run: node scripts/portuguese-automatic-grading-contract-audit.mjs

      - name: Selective grader validation
        run: node scripts/selective-grader-validation-audit.mjs

      - name: Real grader capture
        run: node scripts/real-grader-capture-audit.mjs

      - name: Grader validation report
        run: node scripts/grader-validation-report-audit.mjs

      - name: Score explainability
        run: node scripts/score-explainability-audit.mjs

      - name: Learning feedback intelligence
        run: node scripts/learning-feedback-intelligence-audit.mjs

      - name: Strict observed classification
        run: node scripts/fqa-observed-threshold-audit.mjs

      - name: Grader adversarial bank
        run: node scripts/grader-adversarial-bank.mjs

      - name: Blind human validation campaign
        run: node scripts/grader-human-validation-campaign-audit.mjs

      - name: Three-subject beta candidate
        run: node scripts/three-subject-beta-candidate-audit.mjs

      - name: Release candidate journey
        run: node scripts/release-candidate-journey-audit.mjs

      - name: Public beta readiness
        run: node scripts/public-beta-readiness-audit.mjs

      - name: Desktop beta readiness
        run: node scripts/desktop-beta-readiness-audit.mjs

      - name: Cloud resume product contract
        run: node scripts/cloud-resume-product-contract-audit.mjs

      - name: Closed beta autosync
        run: node scripts/closed-beta-autosync-audit.mjs

      - name: Grader quality report
        run: node scripts/grader-quality-report.mjs

      - name: Content readiness report
        run: npm run content:readiness

      - name: Full production build
        run: npm run build
        env:
          DATABASE_URL: ""
          NEXT_PUBLIC_NEON_AUTH_URL: ""
          NEXT_PUBLIC_NEON_DATA_API_URL: ""

      - name: Pilot release gate location
        if: github.head_ref == 'feature/pilot-readiness-ab'
        run: echo "Pilot SQL schema proof is a mandatory explicit release gate in Post-deploy smoke (workflow_dispatch)."
