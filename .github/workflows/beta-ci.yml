name: Beta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm run test:unit

      - name: Technical gate
        run: npm run technical:gate

      - name: Portuguese automatic grading contract
        run: node scripts/portuguese-automatic-grading-contract-audit.mjs

      - name: Selective grader validation
        run: node scripts/selective-grader-validation-audit.mjs

      - name: Real grader capture
        run: node scripts/real-grader-capture-audit.mjs

      - name: Grader validation report
        run: node scripts/grader-validation-report-audit.mjs

      - name: Score explainability
        run: node scripts/score-explainability-audit.mjs

      - name: Strict observed classification
        run: node scripts/fqa-observed-threshold-audit.mjs

      - name: Grader adversarial bank
        run: node scripts/grader-adversarial-bank.mjs

      - name: Blind human validation campaign
        run: node scripts/grader-human-validation-campaign-audit.mjs

      - name: Three-subject beta candidate
        run: node scripts/three-subject-beta-candidate-audit.mjs

      - name: Public beta readiness
        run: node scripts/public-beta-readiness-audit.mjs

      - name: Desktop beta readiness
        run: node scripts/desktop-beta-readiness-audit.mjs

      - name: Cloud resume product contract
        run: node scripts/cloud-resume-product-contract-audit.mjs

      - name: Grader quality report
        run: node scripts/grader-quality-report.mjs

      - name: Content readiness report
        run: npm run content:readiness

      - name: Prebuild — FQ A foundation
        run: node scripts/physics-chemistry-foundation-audit.mjs

      - name: Prebuild — Portuguese literary coverage
        run: node scripts/portuguese-literary-coverage-audit.mjs

      - name: Prebuild — Parent experience
        run: node scripts/parent-experience-audit.mjs

      - name: Prebuild — Automatic open response
        run: node scripts/automatic-open-response-audit.mjs

      - name: Prebuild — Open response calibration
        run: node scripts/open-response-calibration-audit.mjs

      - name: Prebuild — Explanatory feedback
        run: node scripts/explanatory-feedback-audit.mjs

      - name: Prebuild — Submitted answer lock
        run: node scripts/submitted-answer-lock-audit.mjs

      - name: Prebuild — Open response scale calibration
        run: node scripts/open-response-scale-calibration.mjs

      - name: Prebuild — Response analysis v2
        run: node scripts/response-analysis-calibration-v2.mjs

      - name: Prebuild — Response analysis v3
        run: node scripts/response-analysis-calibration-v3.mjs

      - name: Capture response analysis v3 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: response-analysis-v3-diagnostics
          path: response-analysis-calibration-v3.json
          if-no-files-found: error
          retention-days: 1

      - name: Prebuild — Response analysis v4
        run: node scripts/response-analysis-calibration-v4.mjs

      - name: Prebuild — Response analysis v5
        run: node scripts/response-analysis-calibration-v5.mjs

      - name: Prebuild — Response analysis v6
        run: node scripts/response-analysis-calibration-v6.mjs

      - name: Prebuild — Response analysis v7
        run: node scripts/response-analysis-calibration-v7.mjs

      - name: Prebuild — Error diagnosis
        run: node scripts/error-diagnosis-audit.mjs

      - name: Prebuild — Learning feedback quality
        run: node scripts/learning-feedback-quality-audit.mjs

      - name: Prebuild — Diagnostic minimal pairs
        run: node scripts/diagnostic-minimal-pairs-audit.mjs

      - name: Next production build
        run: npx next build
        env:
          DATABASE_URL: ""
          NEXT_PUBLIC_NEON_AUTH_URL: ""
          NEXT_PUBLIC_NEON_DATA_API_URL: ""

      - name: Performance budget
        run: npm run performance:budget
