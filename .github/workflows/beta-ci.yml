name: Beta CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm run test:unit

      - name: Technical gate
        run: npm run technical:gate

      - name: Portuguese automatic grading contract
        run: node scripts/portuguese-automatic-grading-contract-audit.mjs

      - name: Selective grader validation
        run: node scripts/selective-grader-validation-audit.mjs

      - name: Real grader capture
        run: node scripts/real-grader-capture-audit.mjs

      - name: Grader validation report
        run: node scripts/grader-validation-report-audit.mjs

      - name: Score explainability
        run: node scripts/score-explainability-audit.mjs

      - name: Learning feedback intelligence
        run: node scripts/learning-feedback-intelligence-audit.mjs

      - name: Strict observed classification
        run: node scripts/fqa-observed-threshold-audit.mjs

      - name: Grader adversarial bank
        run: node scripts/grader-adversarial-bank.mjs

      - name: Blind human validation campaign
        run: node scripts/grader-human-validation-campaign-audit.mjs

      - name: Three-subject beta candidate
        run: node scripts/three-subject-beta-candidate-audit.mjs

      - name: Release candidate journey
        run: node scripts/release-candidate-journey-audit.mjs

      - name: Public beta readiness
        run: node scripts/public-beta-readiness-audit.mjs

      - name: Desktop beta readiness
        run: node scripts/desktop-beta-readiness-audit.mjs

      - name: Cloud resume product contract
        run: node scripts/cloud-resume-product-contract-audit.mjs

      - name: Closed beta autosync
        run: node scripts/closed-beta-autosync-audit.mjs

      - name: Grader quality report
        run: node scripts/grader-quality-report.mjs

      - name: Content readiness report
        run: npm run content:readiness

      - name: Full production build
        run: npm run build
        env:
          DATABASE_URL: ""
          NEXT_PUBLIC_NEON_AUTH_URL: ""
          NEXT_PUBLIC_NEON_DATA_API_URL: ""

      - name: Install PostgreSQL client for pilot schema proof
        if: github.head_ref == 'feature/pilot-readiness-ab'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Pilot schema proof — secret configured
        if: github.head_ref == 'feature/pilot-readiness-ab'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PILOT_SMOKE_DATABASE_URL }}
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"

      - name: Pilot schema proof — isolated branch target
        if: github.head_ref == 'feature/pilot-readiness-ab'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PILOT_SMOKE_DATABASE_URL }}
          EXPECTED_DB_HOST: ep-twilight-lab-b2nohzca-pooler.c-6.eu-central-1.aws.neon.tech
        run: |
          set -euo pipefail
          actual_host="$(node -e 'process.stdout.write(new URL(process.env.DATABASE_URL).hostname)')"
          test "$actual_host" = "$EXPECTED_DB_HOST"

      - name: Pilot schema proof — dump before
        if: github.head_ref == 'feature/pilot-readiness-ab'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PILOT_SMOKE_DATABASE_URL }}
        run: |
          set -euo pipefail
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges \
            | sed -e '/^\\restrict /d' -e '/^\\unrestrict /d' \
            > /tmp/schema-before.sql

      - name: Pilot schema proof — apply committed 008 verbatim
        if: github.head_ref == 'feature/pilot-readiness-ab'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PILOT_SMOKE_DATABASE_URL }}
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/migrations/008_pilot_telemetry_consent.sql

      - name: Pilot schema proof — schema unchanged
        if: github.head_ref == 'feature/pilot-readiness-ab'
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.PILOT_SMOKE_DATABASE_URL }}
        run: |
          set -euo pipefail
          pg_dump "$DATABASE_URL" --schema-only --no-owner --no-privileges \
            | sed -e '/^\\restrict /d' -e '/^\\unrestrict /d' \
            > /tmp/schema-after.sql
          cmp -s /tmp/schema-before.sql /tmp/schema-after.sql
