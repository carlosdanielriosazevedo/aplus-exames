name: Temporary pilot sync
on:
  push:
    branches: [codex/fix-vnext-pilot-meta]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor == 'carlosdanielriosazevedo' || github.actor == 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run vnext-pilot:generate
      - name: Commit generated pilot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/vnextPilot.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "vNext: regenerar fixture do piloto após polish editorial"
          git push
