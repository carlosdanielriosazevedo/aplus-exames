name: Materialize constructed response grader once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'Chore: materialize constructed response grader once'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run upgrader one final time
        run: node scripts/upgrade-constructed-response-grader.mjs
      - name: Commit materialized grader source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/constructedResponse.js
          git diff --cached --check
          git diff --cached --exit-code && exit 1 || true
          git commit -m "Grading: materialize IAVE logic in constructedResponse"
          git push origin HEAD:main
