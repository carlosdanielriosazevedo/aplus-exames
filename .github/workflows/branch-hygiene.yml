name: Branch hygiene

on:
  push:
    branches: [main]
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    if: github.repository == 'carlosdanielriosazevedo/aplus-exames'
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale closed-PR branches
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keep = new Set(['main', 'codex/integration-next']);

            const openPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100
            });
            const openHeads = new Set(
              openPulls
                .filter(pr => pr.head.repo?.full_name === owner + '/' + repo)
                .map(pr => pr.head.ref)
            );

            const closedPulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'closed', per_page: 100
            });
            const closedHeads = new Set(
              closedPulls
                .filter(pr => pr.head.repo?.full_name === owner + '/' + repo)
                .map(pr => pr.head.ref)
            );

            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });

            let deleted = 0;
            let skipped = 0;

            for (const row of branches) {
              const branch = row.name;
              if (keep.has(branch) || openHeads.has(branch)) {
                skipped++;
                continue;
              }

              let safeToDelete = closedHeads.has(branch);

              if (!safeToDelete) {
                try {
                  const comparison = await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: 'main...' + branch
                  });
                  safeToDelete = comparison.data.ahead_by === 0;
                } catch (error) {
                  core.warning('Could not compare ' + branch + ': ' + error.message);
                }
              }

              if (!safeToDelete) {
                skipped++;
                continue;
              }

              try {
                await github.rest.git.deleteRef({
                  owner,
                  repo,
                  ref: 'heads/' + branch
                });
                core.info('Deleted stale branch: ' + branch);
                deleted++;
              } catch (error) {
                core.warning('Could not delete ' + branch + ': ' + error.message);
              }
            }

            core.summary
              .addHeading('Branch hygiene')
              .addRaw('Deleted: ' + deleted + '\n\nPreserved: ' + skipped + '\n\nOpen PR heads and codex/integration-next are always preserved.')
              .write();
