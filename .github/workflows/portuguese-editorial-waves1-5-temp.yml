name: Portuguese Editorial Waves1-5 Temp

on:
  push:
    branches:
      - codex/portuguese-editorial-waves1-5

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/portuguese-editorial-waves1-5
      - name: Strengthen Portuguese waves 1 to 5
        run: |
          node <<'NODE'
          const fs=require('fs');
          const dir='content/vnext/portuguese/foundation';
          const files=[1,2,3,4,5].map(n=>`${dir}/portuguese-639-wave${n}.json`);
          const packs=new Map(files.map(path=>[path,JSON.parse(fs.readFileSync(path,'utf8'))]));
          const find=id=>{
            for(const [path,data] of packs){
              const item=data.items.find(x=>x.id===id);
              if(item) return {path,data,item};
            }
            throw new Error(`Missing ${id}`);
          };
          const set=(id,patch)=>Object.assign(find(id).item,patch);

          set('PT639-FND-013',{options:[
            'O horário alargado não gerava vendas suficientes para se justificar.',
            'O elogio inicial dos moradores confirmou-se num aumento estável das compras noturnas.',
            'O regresso ao horário antigo resultou de uma quebra nas vendas antes das vinte horas.',
            'O proprietário manteve o horário alargado por haver procura regular depois das vinte horas.'
          ]});
          set('PT639-FND-014',{options:[
            'uma problematização inicial para exemplos que a resolvem definitivamente.',
            'dois exemplos isolados para uma descrição geral e uma conclusão factual.',
            'uma definição técnica para dados estatísticos e uma síntese sem questão final.',
            'uma descrição geral para exemplos e, depois, para uma problematização.'
          ]});
          set('PT639-FND-017',{options:[
            'conferir ao espaço uma descrição impessoal e verificável.',
            'limitar o relato ao que poderia ser observado por qualquer pessoa.',
            'construir uma perceção subjetiva e inquieta do espaço.',
            'transferir a perceção da praça para um narrador exterior.'
          ]});
          set('PT639-FND-018',{options:[
            'um encadeamento acelerado de ações que antecipa um reencontro.',
            'uma descrição progressiva dos objetos presentes na divisão.',
            'um efeito de continuidade, apesar da interrupção da conversa.',
            'a suspensão e o vazio deixados pela partida.'
          ]});
          set('PT639-FND-025',{options:[
            'A ciclovia é usada por muitas pessoas, precisa de manutenção e liga o centro à estação.',
            'A ciclovia, usada por muitas pessoas, liga o centro à estação e dispensaria manutenção.',
            'Usada por muitas pessoas, a ciclovia precisa de manutenção, embora não ligue o centro à estação.',
            'A ciclovia liga o centro à estação e, por isso, não precisa de manutenção.'
          ]});
          set('PT639-FND-028',{options:[
            'Substituir «Por exemplo» por «Além disso».',
            'Substituir «passaram a escolher» por «escolheram».',
            'Substituir «Portanto» por «Por conseguinte».',
            'Substituir «Portanto» por «Ainda assim».'
          ]});

          set('PT639-FND-032',{options:[
            'apenas a criação de zonas de sombra, excluindo as árvores.',
            'a melhoria do conforto das deslocações a pé.',
            'a plantação de árvores e a instalação de bancos.',
            'a instalação de bancos e o aumento dos percursos pedonais.'
          ]});
          set('PT639-FND-034',{options:['metáfora.','personificação.','hipérbole.','comparação.']});
          set('PT639-FND-041',{options:['Ainda assim.','Além disso.','Entretanto.','Por isso.']});

          set('PT639-FND-046',{options:[
            'A linha não circula ao domingo.',
            'Aos sábados, mantém o mesmo número de viagens dos dias úteis.',
            'Nos dias úteis, o serviço começa às vinte horas.',
            'Ao sábado, o serviço funciona apenas entre as sete e as vinte horas.'
          ]});
          set('PT639-FND-049',{options:[
            'apresentação de vantagens seguida de riscos, terminando sem qualquer proposta.',
            'apresentação dos riscos como refutação total das vantagens iniciais.',
            'apresentação de uma solução híbrida antes da análise dos dois modelos.',
            'apresentação de benefícios e riscos seguida de uma solução conciliadora.'
          ]});
          set('PT639-FND-052',{options:[
            'uma tentativa de reforçar a objetividade do relato perante o leitor.',
            'um afastamento do narrador em relação ao destinatário.',
            'uma transferência da voz narrativa para as paredes personificadas.',
            'uma relação direta entre o narrador e o destinatário.'
          ]});

          set('PT639-FND-061',{options:[
            'À quarta-feira, o museu encerra às vinte e duas horas.',
            'À quarta-feira, a entrada é gratuita durante todo o dia.',
            'Nos restantes dias, o museu encerra sempre às dezoito horas.',
            'À quarta-feira, o museu só abre depois das dezoito horas.'
          ]});
          set('PT639-FND-062',{options:[
            'queriam mostrar à diretora que tinham concluído uma atividade no telemóvel.',
            'antecipavam uma regra ou chamada de atenção relacionada com os telemóveis.',
            'interpretaram a entrada da diretora como sinal de que a aula tinha terminado.',
            'estavam a preparar-se para usar os telemóveis numa tarefa orientada.'
          ]});
          set('PT639-FND-064',{options:[
            'descrição de uma tendência, enumeração de vantagens e apresentação de uma conclusão sem medidas.',
            'descrição de uma tendência, identificação de dificuldades e apresentação de soluções.',
            'identificação de dificuldades, apresentação de soluções e só depois descrição do aumento do uso.',
            'descrição de uma tendência, apresentação de soluções e avaliação dos seus resultados.'
          ]});
          set('PT639-FND-065',{options:[
            'à redução do tempo em que a loja esteve aberta.',
            'ao uso de sensores que evitam iluminação desnecessária.',
            'a uma quebra de clientes ocorrida após a instalação dos sensores.',
            'à substituição das lâmpadas por equipamento de menor potência.'
          ]});
          set('PT639-FND-066',{options:['personificação.','metáfora.','comparação.','hipérbole.']});
          set('PT639-FND-067',{options:[
            'um sinal de que a personagem ainda espera recuperar juridicamente a casa.',
            'uma lembrança material do espaço, sem relação com a identidade da personagem.',
            'elo material com uma identidade e um passado perdidos.',
            'um objeto que revela sobretudo a intenção de regressar fisicamente à casa.'
          ]});
          set('PT639-FND-068',{options:[
            'certeza inicial que o presente confirma sem reservas.',
            'incerteza e consciência da própria parcialidade.',
            'distanciamento completo das emoções que condicionaram o julgamento.',
            'conhecimento objetivo da verdade, apesar do desejo de não perdoar.'
          ]});
          set('PT639-FND-069',{options:[
            'uma aproximação gradual entre o que a personagem diz e o que acaba por fazer.',
            'contraste entre o que é dito e o que é feito.',
            'uma sucessão de ações coerentes com a decisão verbal de permanecer.',
            'uma hesitação que termina sem qualquer mudança de comportamento.'
          ]});
          set('PT639-FND-076',{options:[
            'A escola criou uma horta, que é usada nas aulas e também fornece ervas aromáticas à cantina.',
            'A escola criou uma horta usada nas aulas; por isso, deixou de fornecer ervas aromáticas à cantina.',
            'A escola criou uma horta que fornece ervas aromáticas à cantina, embora não seja usada nas aulas.',
            'A horta, criada pela escola, é usada nas aulas, mas fornece as ervas aromáticas a outra escola.'
          ]});
          set('PT639-FND-077',{options:[
            'A relação causal entre sucesso e resultados está explicitada com dados suficientes.',
            'Redundância e pouca precisão na fundamentação.',
            'A frase apresenta duas razões distintas, mas falta um conector entre elas.',
            'O problema principal é o uso de «porque», inadequado em textos argumentativos.'
          ]});
          set('PT639-FND-078',{options:[
            'A conclusão não decorre claramente das ideias anteriores.',
            'A segunda frase contradiz diretamente a primeira, impedindo qualquer conclusão.',
            'O conector «Por isso» exprime uma relação diferente daquela que o parágrafo pretende construir.',
            'A conclusão repete integralmente a primeira ideia sem introduzir um novo foco.'
          ]});
          set('PT639-FND-079',{acceptedAnswers:[
            'ordenação temporal','sequência temporal','organização temporal','sequenciação temporal',
            'ordenação cronológica','sequência cronológica','organização cronológica','sequenciação cronológica'
          ],explanation:'Os conectores ordenam as ações numa sequência temporal ou cronológica.'});

          set('PT639-FND-081',{options:[
            'A biblioteca encerra à segunda-feira.',
            'Ao sábado, a biblioteca abre à mesma hora dos restantes dias úteis.',
            'Ao domingo, a biblioteca mantém o horário completo dos dias úteis.',
            'À segunda-feira, a biblioteca abre apenas durante a tarde.'
          ]});
          set('PT639-FND-083',{options:[
            'apresentação de dados, comparação de duas causas e conclusão sem propostas.',
            'apresentação de soluções, explicação das suas causas e só depois identificação do problema.',
            'apresentação do problema, explicação de causas e propostas de solução.',
            'apresentação do problema, propostas imediatas e avaliação posterior dos seus resultados.'
          ]});
          set('PT639-FND-084',{options:[
            'retomar a dificuldade inicial sem considerar a estratégia experimentada.',
            'avaliar os efeitos da estratégia apresentada.',
            'introduzir uma segunda estratégia ainda não mencionada no desenvolvimento.',
            'generalizar a experiência do autor para todos os estudantes sem avaliar resultados.'
          ]});
          set('PT639-FND-085',{options:[
            'distinguir apenas o comportamento exterior da Leonor, sem o interpretar.',
            'aceder à interpretação que o narrador faz do comportamento da Leonor.',
            'confirmar diretamente o que a Leonor pensa, sem mediação do narrador.',
            'substituir a perspetiva do narrador pela perspetiva da Leonor.'
          ]});
          set('PT639-FND-086',{options:[
            'uma confirmação, no presente, de que a perspetiva passada era inteiramente correta.',
            'uma narração que elimina qualquer distância entre o eu de agora e o eu de então.',
            'uma recusa de reavaliar o modo como interpretava os conselhos do irmão.',
            'uma revisão crítica, no presente, da perspetiva que tinha no passado.'
          ]});
          set('PT639-FND-087',{options:[
            'manter a chuva apenas como elemento exterior, sem relação com a memória.',
            'aproximar a paisagem exterior da experiência interior do sujeito.',
            'assinalar uma mudança súbita do espaço exterior para um tema sem ligação.',
            'transformar cada ocorrência de «Chove» numa descrição de fenómenos diferentes e autónomos.'
          ]});
          set('PT639-FND-088',{options:[
            'uma continuidade sintática que torna a promessa mais segura.',
            'uma pausa descritiva destinada apenas a destacar a iluminação do corredor.',
            'a sensação de interrupção e de promessa não cumprida.',
            'uma mudança de voz narrativa que afasta o sujeito da promessa.'
          ]});
          set('PT639-FND-089',{options:[
            'Delimitar o conteúdo que será explicado.',
            'Antecipar uma conclusão sobre os efeitos da falta de sono.',
            'Introduzir um exemplo que desenvolverá apenas o primeiro efeito.',
            'Reformular a primeira frase sem anunciar a organização do texto.'
          ]});
          set('PT639-FND-090',{options:[
            'Apresentar os dois benefícios numa frase inicial e desenvolver cada um com o respetivo exemplo.',
            'Manter a ordem atual, mas deslocar o exemplo para antes dos dois benefícios.',
            'Agrupar os dois benefícios no fim e deixar os exemplos num parágrafo separado.',
            'Apresentar primeiro a ideia geral e agrupar depois exemplos associados a cada benefício.'
          ]});
          set('PT639-FND-091',{options:[
            'Por isso, a escola pode oferecer um espaço adicional mesmo a alunos que já estudam em ambientes tranquilos.',
            'Por isso, um espaço silencioso na escola pode garantir condições de concentração a quem não as tem em casa.',
            'Além disso, a existência de salas vazias prova por si só que o estudo silencioso melhora os resultados.',
            'Assim, qualquer aluno estudará melhor na escola do que em casa, independentemente das condições.'
          ]});
          set('PT639-FND-092',{options:[
            'A limitação do trânsito pode tornar a entrada mais organizada, embora esse efeito não esteja necessariamente ligado à segurança ou à saúde.',
            'A medida pode reduzir algum ruído, mas esse resultado, isoladamente, não demonstra a necessidade de limitar o trânsito junto das escolas.',
            'Reduzir o trânsito pode diminuir risco rodoviário e exposição dos alunos à poluição nas horas de entrada e saída.',
            'A existência de transportes públicos próximos pode facilitar deslocações, mas não constitui por si só um argumento direto para limitar o trânsito automóvel.'
          ]});
          set('PT639-FND-093',{options:[
            'assinalar a retoma condensada da posição defendida.',
            'introduzir uma consequência nova que ainda precisa de ser demonstrada.',
            'marcar uma concessão antes da formulação da posição final.',
            'retomar apenas um exemplo secundário apresentado no desenvolvimento.'
          ]});
          set('PT639-FND-094',{options:[
            'Embora possam ser úteis em certas tarefas, a sua utilização livre durante toda a aula deve manter-se sem regras.',
            'Mesmo quando distraem, os telemóveis devem substituir outros recursos pedagógicos sempre que estejam disponíveis.',
            'Apesar de poderem apoiar algumas atividades, a possibilidade de distração justifica uma proibição total em qualquer contexto.',
            'Embora possam causar distração, os telemóveis também podem ser úteis em atividades pedagógicas orientadas.'
          ]});
          set('PT639-FND-095',{options:[
            'Um aluno pode preferir a bicicleta mesmo sem ciclovias, desde que o percurso seja curto.',
            'Um aluno que vive a três quilómetros da escola pode optar pela bicicleta se existir um percurso contínuo e seguro.',
            'A existência de bicicletas numa escola mostra que todos os trajetos curtos podem ser feitos sem automóvel.',
            'Uma ciclovia pode ser utilizada em deslocações longas, embora isso não mostre como altera uma viagem curta.'
          ]});
          set('PT639-FND-096',{options:[
            'Apresenta várias razões diferentes, mas não indica qual é a mais importante.',
            'Usa uma posição demasiado específica para sustentar a criação dos clubes.',
            'Repete a mesma ideia sem desenvolver uma razão concreta.',
            'Reconhece uma objeção, mas não responde a essa objeção no final.'
          ]});

          for(const [path,data] of packs) fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          NODE
      - name: Commit editorial changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/vnext/portuguese/foundation/portuguese-639-wave{1,2,3,4,5}.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reforçar revisão editorial das vagas 1 a 5 de Português"
          git push origin HEAD:codex/portuguese-editorial-waves1-5
