name: Apply score explainability patch

on:
  push:
    branches: [codex/score-explainability-all-subjects]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[score-explainability-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/score-explainability-all-subjects
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-score-explainability.mjs
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/automaticEvidenceGrader.js app/lib/portugueseEngine.js app/lib/physicsChemistryRubric.js app/lib/constructedResponse.js app/components/PortugueseSubject.js app/components/PhysicsChemistrySubject.js app/page.js
          git diff --cached --quiet && exit 0
          git commit -m "Explicar cada ponto perdido nas três disciplinas [score-explainability-applied]"
          git push origin HEAD:codex/score-explainability-all-subjects
