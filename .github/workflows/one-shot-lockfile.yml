name: One-shot dependency lockfile generation

on:
  push:
    branches:
      - launch/public-rc-hardening

permissions:
  contents: write

jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/public-rc-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Generate deterministic npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install contract
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfile already current.'
            exit 0
          fi
          git commit -m 'Lock launch dependency graph'
          git push origin HEAD:launch/public-rc-hardening
