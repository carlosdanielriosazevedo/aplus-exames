name: Temp Portuguese mini-exam flow integration

on:
  push:
    branches:
      - codex/portuguese-mini-exam-flow
    paths:
      - .github/workflows/temp-portuguese-mini-exam-flow.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/portuguese-mini-exam-flow
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Integrate Portuguese mini-exam in app flow
        run: |
          node <<'NODE'
          const fs=require('fs');
          function replaceOnce(source,from,to,label){
            const count=source.split(from).length-1;
            if(count!==1)throw new Error(`${label}: esperado 1 match, obtidos ${count}`);
            return source.replace(from,to);
          }

          const pagePath='app/page.js';
          let page=fs.readFileSync(pagePath,'utf8');
          page=replaceOnce(page,
            'import {ReviewerDashboard} from "./components/ReviewerDashboard";\n',
            'import {ReviewerDashboard} from "./components/ReviewerDashboard";\nimport PortuguesePassageMiniExam from "./components/PortuguesePassageMiniExam";\n',
            'import component');
          page=replaceOnce(page,
            'import {PORTUGUESE_ITEMS,portugueseItemById} from "./data/portugueseContent";\n',
            'import {PORTUGUESE_ITEMS,portugueseItemById} from "./data/portugueseContent";\nimport portuguesePassageDocument from "../content/vnext/portuguese/portuguese-639-passage-prototypes.json";\n',
            'import passage data');
          page=replaceOnce(page,
            'import {portugueseWordLimitFeedback} from "./lib/portugueseWordLimit";\n',
            'import {portugueseWordLimitFeedback} from "./lib/portugueseWordLimit";\nimport {buildPortuguesePassagePrototypeExam} from "./lib/portuguesePassages";\nimport "./portugues-mini-exame/passage-mini-exam.css";\n',
            'import passage engine');
          page=replaceOnce(page,
            '  if(screen==="portugueseLab")return <PortugueseLab s={s} setS={setS} go={go}/>;\n',
            '  if(screen==="portugueseLab")return <PortugueseLab s={s} setS={setS} go={go}/>;\n  if(screen==="portugueseMiniExam")return <PortuguesePassageMiniExam exam={buildPortuguesePassagePrototypeExam(portuguesePassageDocument)} onExit={()=>go("portugueseLab")}/>;\n',
            'screen route');
          page=replaceOnce(page,
            '    <div className="notice"><b>Gate quantitativo atingido, publicação bloqueada</b><span>Os 60 itens permitem testar os fluxos. Não substituem revisão editorial, calibração de dificuldade nem validação da correção aberta.</span></div>\n',
            '    <section className="portugueseLabSection"><h2>Mini-exame</h2><button className="portugueseLabAction featured" onClick={()=>go("portugueseMiniExam")}><b>Testar mini-exame com texto partilhado</b><span>2 textos · 6 questões · leitura e educação literária · revisão no fim</span></button><small className="portugueseMethodNote">Protótipo interno: o texto permanece associado ao grupo de perguntas e as respostas abertas não recebem classificação automática final.</small></section>\n    <div className="notice"><b>Gate quantitativo atingido, publicação bloqueada</b><span>Os 120 itens permitem testar os fluxos. Não substituem revisão editorial, calibração de dificuldade nem validação da correção aberta.</span></div>\n',
            'lab mini exam entry');
          page=replaceOnce(page,
            'function Exams({s,go,startMini}){\n  const last=s.lastExam;\n',
            'function Exams({s,go,startMini}){\n  if(s.activeSubjectId==="portuguese")return <Shell><Back go={go} to="train"/><p className="eyebrow">MINI-EXAME · PORTUGUÊS 639</p><h1>Texto e questões em contexto de prova.</h1><ApronsoNudge pose="thinking" tone="dark">Num texto de exame, várias perguntas podem depender da mesma leitura. Vou manter o texto disponível enquanto respondes.</ApronsoNudge><button className="exam examAction" onClick={()=>go("portugueseMiniExam")}><div><b>⚡ Mini-exame com texto partilhado</b><span>2 textos · 6 questões · seleção + resposta restrita</span></div><strong>Começar →</strong></button><div className="notice warning"><b>Português continua em preparação</b><span>Este fluxo está integrado para validação interna, mas a disciplina permanece bloqueada para alunos até cumprir os critérios de beta.</span></div></Shell>;\n  const last=s.lastExam;\n',
            'subject-aware exams');
          fs.writeFileSync(pagePath,page);

          const componentPath='app/components/PortuguesePassageMiniExam.js';
          let component=fs.readFileSync(componentPath,'utf8');
          component=replaceOnce(component,
            'export default function PortuguesePassageMiniExam({exam}){',
            'export default function PortuguesePassageMiniExam({exam,onExit=null}){',
            'component signature');
          component=replaceOnce(component,
            '        <button className="ptx-ghost" onClick={()=>setReview(false)}>Voltar às respostas</button>\n',
            '        <div className="ptx-header-actions"><button className="ptx-ghost" onClick={()=>setReview(false)}>Voltar às respostas</button>{onExit&&<button className="ptx-ghost" onClick={onExit}>Sair do mini-exame</button>}</div>\n',
            'review exit');
          component=replaceOnce(component,
            '      <div className="ptx-progress-copy"><strong>{index+1}</strong> / {exam.itemCount}</div>\n',
            '      <div className="ptx-header-actions">{onExit&&<button className="ptx-ghost" onClick={onExit}>Sair</button>}<div className="ptx-progress-copy"><strong>{index+1}</strong> / {exam.itemCount}</div></div>\n',
            'run exit');
          fs.writeFileSync(componentPath,component);

          const cssPath='app/portugues-mini-exame/passage-mini-exam.css';
          let css=fs.readFileSync(cssPath,'utf8');
          if(!css.includes('.ptx-header-actions{')){
            css=css.replace('.ptx-progress-copy{font-size:18px;white-space:nowrap}', '.ptx-header-actions{display:flex;align-items:center;gap:10px}.ptx-progress-copy{font-size:18px;white-space:nowrap}');
          }
          fs.writeFileSync(cssPath,css);
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/components/PortuguesePassageMiniExam.js app/portugues-mini-exame/passage-mini-exam.css
          git commit -m "Integrar mini-exame de Português no fluxo normal da app"
          git push origin HEAD:codex/portuguese-mini-exam-flow
