name: Materialize Portuguese UI once

on:
  push:
    branches:
      - codex/portuguese-wave5-balanced-main
    paths:
      - .github/workflows/materialize-portuguese-ui-once.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/portuguese-wave5-balanced-main
          fetch-depth: 0

      - name: Materialize existing Portuguese UI patches
        run: node scripts/apply-portuguese-word-limit-ui.mjs

      - name: Remove patch scripts and one-time workflow
        run: |
          rm scripts/apply-portuguese-word-limit-ui.mjs
          rm scripts/apply-portuguese-observation-guidance-ui.mjs
          rm .github/workflows/materialize-portuguese-ui-once.yml

      - name: Verify materialized source
        run: |
          grep -F 'import {portugueseWordLimitFeedback} from "./lib/portugueseWordLimit";' app/page.js
          grep -F 'import {portugueseObservationGuidance} from "./lib/portugueseObservationGuidance";' app/page.js
          grep -F 'const wordLimitFeedback=!isChoice&&!isShort?portugueseWordLimitFeedback(item,answer):null;' app/page.js
          grep -F 'rubricEvidenceGuide' app/page.js
          grep -F 'Portuguese word-limit feedback' app/globals.css
          grep -F 'Portuguese observation guidance' app/globals.css
          test ! -e scripts/apply-portuguese-word-limit-ui.mjs
          test ! -e scripts/apply-portuguese-observation-guidance-ui.mjs
          ! grep -q 'apply-portuguese-word-limit-ui' package.json

      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/globals.css scripts .github package.json
          git commit -m "Materializar UI de Português e remover patches de build"
          git push origin HEAD:codex/portuguese-wave5-balanced-main
