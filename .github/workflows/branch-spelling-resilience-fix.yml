name: Apply spelling resilience fix

on:
  push:
    branches: [codex/score-explainability-all-subjects]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[spelling-resilience-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/score-explainability-all-subjects
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/apply-spelling-resilience-fix.mjs
      - run: node scripts/response-analysis-calibration-v7.mjs
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/lib/automaticEvidenceGrader.js
          git diff --cached --quiet && exit 0
          git commit -m "Tornar matching ortográfico simétrico [spelling-resilience-applied]"
          git push origin HEAD:codex/score-explainability-all-subjects
