name: One-off root bundle refactor

on:
  push:
    branches:
      - fix/enforce-total-client-bundle-budget

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/enforce-total-client-bundle-budget
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refactor root response loading
        run: node scripts/refactor-root-response-loading.mjs
      - name: Commit refactor
        run: |
          if git diff --quiet -- app/page.js; then
            echo "No page change produced"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js
          git commit -m "perf: lazy-load constructed response grading on root"
          git push origin HEAD:fix/enforce-total-client-bundle-budget
