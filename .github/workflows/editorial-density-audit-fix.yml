name: Editorial density audit fix

on:
  push:
    branches:
      - fix/editorial-density-apronso-alignment

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/editorial-density-apronso-alignment
      - name: Align audit with reduced-copy design
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("scripts/student-experience-audit.mjs")
          s=p.read_text(encoding="utf-8")
          old='assert.ok((page.match(/<ApronsoNudge/g)||[]).length>=2,"O Apronso deve acompanhar os principais ecrãs da experiência.");'
          new='assert.ok((page.match(/<ApronsoNudge/g)||[]).length>=1,"O Apronso deve acompanhar ecrãs onde acrescenta orientação útil, sem repetir a interface.");'
          if old not in s:
              raise SystemExit("Expected Apronso nudge gate not found")
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          PY
      - name: Commit audit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/editorial-density-audit-fix.yml
          git add scripts/student-experience-audit.mjs
          git diff --cached --check
          git commit -m "Align UX audit with reduced ranking copy"
          git push origin HEAD:fix/editorial-density-apronso-alignment
