name: Block 1.2 source edit

on:
  push:
    branches:
      - fix/block1-2-diagnostic-resume-reload

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/block1-2-diagnostic-resume-reload
      - name: Fix active subject normalization
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/clientApp.js')
          s=p.read_text()
          old='const activeSubjectSelected=AVAILABLE_SUBJECT_IDS.includes(activeSubjectId)&&uniqueSubjectIds(recoveredState.selectedSubjectIds||[]).includes(activeSubjectId);'
          new='const activeSubjectSelected=AVAILABLE_SUBJECT_IDS.includes(activeSubjectId)&&uniqueSubjectIds(recoveredState.selectedSubjectIds||[],AVAILABLE_SUBJECT_IDS).includes(activeSubjectId);'
          if s.count(old)!=1:
            raise SystemExit(f'expected 1 match, got {s.count(old)}')
          p.write_text(s.replace(old,new))
          PY
          rm .github/workflows/block1-2-source-edit.yml
      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/clientApp.js .github/workflows/block1-2-source-edit.yml
          git commit -m 'fix: validar disciplina ativa contra catálogo disponível'
          git push origin HEAD:fix/block1-2-diagnostic-resume-reload
