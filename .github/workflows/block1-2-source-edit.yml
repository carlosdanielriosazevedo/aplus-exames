name: Block 1.2 source edit

on:
  push:
    branches:
      - fix/block1-2-diagnostic-resume-reload

permissions:
  contents: write

jobs:
  edit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/block1-2-diagnostic-resume-reload
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply exact source changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app/clientApp.js')
          s=p.read_text()
          replacements=[]
          replacements.append((
            'const canRecover=recovered&&(validDraft?.kind==="diagnostic"?!recoveredState.diagnosticDone:recoveredState.diagnosticDone);',
            'const canRecover=recovered&&(validDraft?.kind==="diagnostic"?!activeSubjectDiagnosticDone(recoveredState):activeSubjectDiagnosticDone(recoveredState));',
            'active-subject recovery'
          ))
          replacements.append((
            '''      const portuguesePaused=recoveredState.activeSubjectId==="portuguese"&&(\n        !!subjectProgressFor(recoveredState,"portuguese").lastPosition||\n        !!recoveredState.subjectSettings?.portuguese?.miniExamDraft\n      );\n      setScreen(activeSubjectDiagnosticDone(recoveredState)||portuguesePaused?"home":"welcome");''',
            '''      const activeSubjectId=recoveredState.activeSubjectId;\n      const activeSubjectSelected=AVAILABLE_SUBJECT_IDS.includes(activeSubjectId)&&uniqueSubjectIds(recoveredState.selectedSubjectIds||[]).includes(activeSubjectId);\n      const activeProgress=activeSubjectId&&activeSubjectId!=="math-a"?subjectProgressFor(recoveredState,activeSubjectId):null;\n      const subjectPaused=!!activeProgress?.lastPosition||(activeSubjectId==="portuguese"&&!!recoveredState.subjectSettings?.portuguese?.miniExamDraft);\n      const configuredActive=activeSubjectSelected&&!!recoveredState.profile?.schoolYear;\n      if(activeSubjectDiagnosticDone(recoveredState)||subjectPaused)setScreen("home");\n      else if(configuredActive)setScreen("diag");\n      else setScreen("welcome");''',
            'startup fallback'
          ))
          replacements.append((
            '<button className="pauseLink" onClick={()=>go("diag")}>Guardar e continuar depois</button>',
            '<button className="pauseLink" onClick={()=>go("home")}>Guardar e continuar depois</button>',
            'math pause to home'
          ))
          replacements.append((
            '''    {pausedDraft&&<div className="pausedSession"><div><small>SESSÃO EM PAUSA</small><b>{pausedDraft.kind==="mini_exam"?"Mini-exame":pausedDraft.kind==="training"?"Treino Livre":"Missão"}</b><span>O teu progresso desta sessão ficou guardado neste dispositivo.</span></div><button onClick={()=>{\n      if(pausedDraft.kind==="mini_exam")go(pausedDraft.screen||"miniExamRun");\n      else if(pausedDraft.kind==="training")go("trainingRun");\n      else go("mission");\n    }}>Continuar →</button></div>}''',
            '''    {pausedDraft&&<div className="pausedSession"><div><small>SESSÃO EM PAUSA</small><b>{pausedDraft.kind==="mini_exam"?"Mini-exame":pausedDraft.kind==="training"?"Treino Livre":pausedDraft.kind==="diagnostic"?"Diagnóstico":"Missão"}</b><span>{pausedDraft.kind==="diagnostic"?`Pergunta ${(pausedDraft.responses?.length||0)+1} · o teu progresso ficou guardado neste dispositivo.`:"O teu progresso desta sessão ficou guardado neste dispositivo."}</span></div><button onClick={()=>{\n      if(pausedDraft.kind==="mini_exam")go(pausedDraft.screen||"miniExamRun");\n      else if(pausedDraft.kind==="training")go("trainingRun");\n      else if(pausedDraft.kind==="diagnostic")go("diagRun");\n      else go("mission");\n    }}>Continuar →</button></div>}''',
            'home diagnostic paused card'
          ))
          for old,new,label in replacements:
            count=s.count(old)
            if count != 1:
              raise SystemExit(f'{label}: expected 1 match, got {count}')
            s=s.replace(old,new)
          p.write_text(s)
          PY
          rm .github/workflows/block1-2-source-edit.yml
      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/clientApp.js .github/workflows/block1-2-source-edit.yml
          git commit -m 'fix: retomar diagnóstico por disciplina ativa'
          git push origin HEAD:fix/block1-2-diagnostic-resume-reload
