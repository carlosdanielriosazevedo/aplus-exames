name: Apply final RC school picker

on:
  push:
    branches:
      - fix/national-school-picker-final-rc
    paths:
      - scripts/apply-national-school-picker.py
      - .github/workflows/apply-final-rc-school-picker.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Generate canonical national school catalogue and apply polish
        run: python3 scripts/apply-national-school-picker.py

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: School catalogue audit
        run: node scripts/school-catalog-audit.mjs

      - name: Final public RC audit
        run: node scripts/final-public-rc-audit.mjs

      - name: Mobile and student experience
        run: |
          npm run mobile:audit
          npm run student-experience:audit
          npm run curriculum-picker-home-contrast:audit

      - name: Technical Gate
        run: npm run technical:gate

      - name: Production build and performance budget
        run: npm run build

      - name: Commit validated changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app scripts
          git commit -m "Canonical national school picker and final RC polish"
          git push origin HEAD:${{ github.ref_name }}
