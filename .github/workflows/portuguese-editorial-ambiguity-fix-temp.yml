name: Portuguese Editorial Ambiguity Fix Temp

on:
  push:
    branches:
      - codex/portuguese-editorial-waves1-5

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/portuguese-editorial-waves1-5
      - name: Remove two editorial ambiguities structurally
        run: |
          node <<'NODE'
          const fs=require('fs');
          const updates={
            'content/vnext/portuguese/foundation/portuguese-639-wave4.json':{
              'PT639-FND-078':{
                options:[
                  'A conclusão não decorre claramente das ideias anteriores.',
                  'A segunda frase contradiz diretamente a primeira, impedindo qualquer conclusão.',
                  'O problema está apenas na repetição de uma ideia, não na relação lógica entre as frases.',
                  'A conclusão repete integralmente a primeira ideia sem introduzir um novo foco.'
                ]
              }
            },
            'content/vnext/portuguese/foundation/portuguese-639-wave5.json':{
              'PT639-FND-090':{
                options:[
                  'Apresentar os dois benefícios numa frase inicial, mas conservar os exemplos separados das ideias que ilustram.',
                  'Manter a ordem atual, mas deslocar o exemplo para antes dos dois benefícios.',
                  'Agrupar os dois benefícios no fim e deixar os exemplos num parágrafo separado.',
                  'Apresentar primeiro a ideia geral e agrupar depois exemplos associados a cada benefício.'
                ]
              }
            }
          };
          for(const [path,byId] of Object.entries(updates)){
            const data=JSON.parse(fs.readFileSync(path,'utf8'));
            for(const [id,patch] of Object.entries(byId)){
              const item=data.items.find(row=>row.id===id);
              if(!item) throw new Error(`Missing ${id}`);
              Object.assign(item,patch);
            }
            fs.writeFileSync(path,JSON.stringify(data,null,2)+'\n');
          }
          NODE
      - name: Commit fixes
        run: |
          if git diff --quiet -- content/vnext/portuguese/foundation/portuguese-639-wave4.json content/vnext/portuguese/foundation/portuguese-639-wave5.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/vnext/portuguese/foundation/portuguese-639-wave4.json content/vnext/portuguese/foundation/portuguese-639-wave5.json
          git commit -m "Remover ambiguidades editoriais em dois itens de Português"
          git push origin HEAD:codex/portuguese-editorial-waves1-5
