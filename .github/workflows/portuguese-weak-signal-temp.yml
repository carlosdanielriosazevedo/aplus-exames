name: Portuguese Weak Signal Temp

on:
  push:
    branches:
      - codex/portuguese-authenticity-pass

jobs:
  inspect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate weak distractor signals
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const dir='content/vnext/portuguese/foundation';
          const files=fs.readdirSync(dir).filter(n=>/^portuguese-639-(?:pilot|wave\d+)\.json$/.test(n));
          const items=files.flatMap(n=>JSON.parse(fs.readFileSync(path.join(dir,n),'utf8')).items);
          const re=/\b(?:sempre|nunca|apenas|exclusivamente|qualquer|imediatamente|totalmente)\b/iu;
          for(const item of items){
            if(item.responseType!=='multiple-choice') continue;
            const hits=item.options.map((option,index)=>({option,index})).filter(x=>x.index!==item.answerIndex&&re.test(x.option));
            if(hits.length>=2) console.log(JSON.stringify({id:item.id,answerIndex:item.answerIndex,hits},null,2));
          }
          NODE
