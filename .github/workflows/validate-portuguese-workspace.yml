name: Validate Portuguese workspace

on:
  push:
    branches:
      - work/finish-portuguese-workspace
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run technical:gate
      - run: npm run build
