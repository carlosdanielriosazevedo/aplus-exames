name: Public launch split

on:
  push:
    branches: [launch/public-rc-hardening]
    paths:
      - .github/workflows/public-launch-split.yml
      - scripts/public-launch-split-bootstrap.mjs

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[public-launch-split]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/public-rc-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/public-launch-split-bootstrap.mjs
      - name: Commit split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.js app/clientApp.js app/public-release.css scripts/*.mjs
          git commit -m "[public-launch-split] Defer full study client from first visit"
          git push origin HEAD:launch/public-rc-hardening
