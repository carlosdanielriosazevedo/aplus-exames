name: One-shot CSS compatibility cleanup

on:
  push:
    branches:
      - launch/public-rc-hardening

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: launch/public-rc-hardening
          fetch-depth: 0
      - name: Replace legacy end alignment where semantics are unchanged
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/globals.css')
          s=p.read_text()
          targets=[
            '.hello{display:flex;justify-content:space-between;align-items:end',
            '.reviewToolbar{display:grid;grid-template-columns:1fr 1.4fr 1.2fr auto;gap:8px;align-items:end',
            '.betaIdentity{display:grid;grid-template-columns:1fr 1.3fr auto;gap:8px;align-items:end',
            '.dailyMissionHero{display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:8px;align-items:end',
            '.parentTrendChart{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:end'
          ]
          changed=0
          for old in targets:
            new=old.replace('align-items:end','align-items:flex-end')
            if old in s:
              s=s.replace(old,new,1)
              changed+=1
            elif new not in s:
              raise SystemExit(f'Expected CSS contract not found: {old}')
          p.write_text(s)
          print(f'Updated {changed} legacy alignment declarations.')
          PY
          git diff --check
      - name: Commit cleanup
        run: |
          if git diff --quiet; then
            echo 'No CSS cleanup required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/globals.css
          git commit -m 'Normalize CSS end alignment compatibility'
          git push origin HEAD:launch/public-rc-hardening
